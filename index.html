    /* GateGoat aesthetic */
    .gg-root {
      position: relative;
      min-height: 100vh;
    }
    .gg-root::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(217,104,43,0.05) 0, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(74,123,168,0.06) 0, transparent 40%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11 0 0 0 0 0.09 0 0 0 0 0.08 0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      pointer-events: none;
      z-index: 0;
    }
    .gg-display {
      font-family: 'Fraunces', Georgia, serif;
      font-optical-sizing: auto;
      font-variation-settings: "opsz" 144;
      letter-spacing: -0.02em;
    }
    .gg-mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      letter-spacing: -0.01em;
    }
    .gg-pass {
      background: #FFFCF4;
      border: 1.5px solid #1C1814;
      border-radius: 14px;
      position: relative;
      box-shadow: 8px 8px 0 #1C1814;
    }
    .gg-pass::before, .gg-pass::after {
      content: "";
      position: absolute;
      width: 24px; height: 24px;
      background: #F2EBDD;
      border: 1.5px solid #1C1814;
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
    }
    .gg-pass::before { left: -13px; }
    .gg-pass::after { right: -13px; }
    .gg-perforation {
      border-left: 2px dashed #1C1814;
      opacity: 0.4;
    }
    .gg-card {
      background: #FFFCF4;
      border: 1.5px solid #1C1814;
      border-radius: 14px;
      box-shadow: 6px 6px 0 #1C1814;
    }
    .gg-card-warm {
      background: #FBE3CC;
      border: 1.5px solid #1C1814;
      border-radius: 14px;
      box-shadow: 6px 6px 0 #1C1814;
    }
    .gg-card-cool {
      background: #DCE7F2;
      border: 1.5px solid #1C1814;
      border-radius: 14px;
      box-shadow: 6px 6px 0 #1C1814;
    }
    .gg-btn {
      background: #1C1814;
      color: #F2EBDD;
      border: 1.5px solid #1C1814;
      border-radius: 999px;
      padding: 14px 26px;
      font-family: inherit;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
      box-shadow: 4px 4px 0 #D9682B;
    }
    .gg-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #D9682B; }
    .gg-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #D9682B; }
    .gg-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .gg-btn-ghost {
      background: transparent;
      color: #1C1814;
      border: 1.5px solid #1C1814;
      border-radius: 999px;
      padding: 10px 20px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .gg-btn-ghost:hover { background: #1C1814; color: #F2EBDD; }
    .gg-input {
      background: #FFFCF4;
      border: 1.5px solid #1C1814;
      border-radius: 10px;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      width: 100%;
      outline: none;
      color: #1C1814;
      transition: box-shadow 120ms ease;
    }
    .gg-input:focus {
      box-shadow: 3px 3px 0 #D9682B;
    }
    .gg-input::placeholder {
      color: rgba(28,24,20,0.4);
    }
    .gg-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      opacity: 0.65;
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .gg-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #1C1814;
      color: #F2EBDD;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .gg-tag-amber { background: #D9682B; }
    .gg-tag-blue { background: #4A7BA8; }
    .gg-tag-sage { background: #7B8A6E; }
    .gg-divider {
      height: 1.5px;
      background: #1C1814;
      opacity: 0.15;
    }
    .gg-route-line {
      height: 2px;
      background: repeating-linear-gradient(
        to right, #1C1814 0, #1C1814 6px, transparent 6px, transparent 12px
      );
      flex: 1;
      position: relative;
    }
    .gg-route-line::after {
      content: "✈";
      position: absolute;
      top: -10px;
      right: 50%;
      transform: translateX(50%);
      font-size: 18px;
      background: #FFFCF4;
      padding: 0 6px;
    }
    .gg-fade-in { animation: ggFade 500ms ease both; }
    @keyframes ggFade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .gg-stagger > * { opacity: 0; animation: ggFade 600ms ease forwards; }
    .gg-stagger > *:nth-child(1) { animation-delay: 0ms; }
    .gg-stagger > *:nth-child(2) { animation-delay: 120ms; }
    .gg-stagger > *:nth-child(3) { animation-delay: 240ms; }
    .gg-spin { animation: ggSpin 1s linear infinite; }
    @keyframes ggSpin { to { transform: rotate(360deg); } }
    .gg-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      cursor: pointer;
      animation: ggSlide 400ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      max-width: calc(100vw - 32px);
    }
    .gg-toast-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #1C1814;
      color: #F2EBDD;
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 6px 6px 0 #D9682B, 0 8px 30px rgba(0,0,0,0.18);
      min-width: 320px;
      max-width: 480px;
    }
    .gg-toast-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #D9682B;
      color: #FFFCF4;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      animation: ggRing 0.7s ease-in-out 0s 3;
    }
    @keyframes ggSlide {
      from { transform: translate(-50%, -120%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    @keyframes ggRing {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-18deg); }
      75% { transform: rotate(18deg); }
    }
    .gg-name-input {
      background: #FFFCF4;
      border: 1.5px solid #1C1814;
      border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      width: 140px;
      outline: none;
      color: #1C1814;
    }
    .gg-name-input:focus {
      box-shadow: 3px 3px 0 #D9682B;
    }
    .gg-orange { color: #D9682B; }
    .gg-blue { color: #4A7BA8; }
    .gg-sage { color: #7B8A6E; }

    /* Airport autocomplete */
    .gg-autocomplete {
      position: relative;
    }
    .gg-suggest {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #FFFCF4;
      border: 1.5px solid #1C1814;
      border-radius: 10px;
      margin-top: 4px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 20;
      box-shadow: 4px 4px 0 #1C1814;
    }
    .gg-suggest-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(28,24,20,0.1);
      transition: background 80ms ease;
    }
    .gg-suggest-item:last-child { border-bottom: none; }
    .gg-suggest-item:hover, .gg-suggest-item.active { background: #FBE3CC; }
    .gg-suggest-code {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.05em;
    }
    .gg-suggest-name {
      font-size: 12px;
      opacity: 0.7;
    }

    /* helper visual */
    .space-y-3 > * + * { margin-top: 12px; }

    const haversine = (lat1, lng1, lat2, lng2) => {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLng = ((lng2 - lng1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    };

    const weatherInfo = (code) => {
      if (code === 0) return { label: "Clear sky", icon: "sun", tone: "sun" };
      if ([1, 2, 3].includes(code)) return { label: "Partly cloudy", icon: "cloud-sun", tone: "mix" };
      if ([45, 48].includes(code)) return { label: "Foggy", icon: "cloud-fog", tone: "cool" };
      if ([51, 53, 55, 56, 57].includes(code)) return { label: "Drizzle", icon: "cloud-drizzle", tone: "cool" };
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { label: "Rain", icon: "cloud-rain", tone: "cool" };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { label: "Snow", icon: "cloud-snow", tone: "cool" };
      if ([95, 96, 99].includes(code)) return { label: "Thunderstorm", icon: "cloud-lightning", tone: "warn" };
      return { label: "Cloudy", icon: "cloud", tone: "mix" };
    };

    const fmtTime = (t) => {
      if (!t) return "—";
      const [h, m] = t.split(":").map(Number);
      const ampm = h >= 12 ? "PM" : "AM";
      const hh = ((h + 11) % 12) + 1;
      return `${hh}:${String(m).padStart(2, "0")} ${ampm}`;
    };

    const fmtDate = (d) => {
      if (!d) return "—";
      try {
        const dt = new Date(d + "T00:00:00");
        return dt.toLocaleDateString(undefined, {
          weekday: "short", month: "short", day: "numeric",
        });
      } catch { return d; }
    };

    const daysFromToday = (date) => {
      if (!date) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(date + "T00:00:00");
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    };

    const boardingMinusFifteen = (date, time) => {
      if (!date || !time) return null;
      const [h, m] = time.split(":").map(Number);
      const dt = new Date(date + "T00:00:00");
      dt.setHours(h, m - 15, 0, 0);
      return dt;
    };

    const formatTimeUntil = (target, nowMs) => {
      if (!target) return "";
      const ms = target.getTime() - nowMs;
      if (ms <= 0) return "now";
      const totalMin = Math.floor(ms / 60000);
      const days = Math.floor(totalMin / 1440);
      const hrs = Math.floor((totalMin % 1440) / 60);
      const mins = totalMin % 60;
      if (days > 0) return `in ${days}d ${hrs}h`;
      if (hrs > 0) return `in ${hrs}h ${mins}m`;
      if (mins > 0) return `in ${mins} min`;
      return "in <1 min";
    };

    function minusMinutes(time, mins) {
      const [h, m] = time.split(":").map(Number);
      const total = h * 60 + m - mins;
      const adj = ((total % 1440) + 1440) % 1440;
      const nh = Math.floor(adj / 60);
      const nm = adj % 60;
      return fmtTime(`${String(nh).padStart(2, "0")}:${String(nm).padStart(2, "0")}`);
    }

    // ============== AIRPORT AUTOCOMPLETE ==============
    function AirportInput({ value, onChange, placeholder, label }) {
      const [query, setQuery] = useState(value?.code || "");
      const [open, setOpen] = useState(false);
      const [activeIdx, setActiveIdx] = useState(0);
      const wrapRef = useRef(null);

      useEffect(() => {
        const onClick = (e) => {
          if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener("mousedown", onClick);
        return () => document.removeEventListener("mousedown", onClick);
      }, []);

      const matches = useMemo(() => {
        if (!query) return [];
        const q = query.trim().toUpperCase();
        return AIRPORTS
          .map(a => {
            let score = 0;
            if (a.code === q) score += 100;
            else if (a.code.startsWith(q)) score += 60;
            const cityU = a.city.toUpperCase();
            const nameU = a.name.toUpperCase();
            if (cityU.startsWith(q)) score += 40;
            else if (cityU.includes(q)) score += 20;
            if (nameU.includes(q)) score += 10;
            return { a, score };
          })
          .filter(x => x.score > 0)
          .sort((x,y) => y.score - x.score)
          .slice(0, 8)
          .map(x => x.a);
      }, [query]);

      const pick = (a) => {
        onChange(a);
        setQuery(a.code);
        setOpen(false);
      };

      return (
        <div className="gg-autocomplete" ref={wrapRef}>
          {label && <label className="gg-label">{label}</label>}
          <input
            type="text"
            className="gg-input gg-mono"
            value={query}
            placeholder={placeholder}
            onChange={(e) => {
              setQuery(e.target.value.toUpperCase());
              setOpen(true);
              setActiveIdx(0);
              if (!e.target.value) onChange(null);
            }}
            onFocus={() => query && setOpen(true)}
            onKeyDown={(e) => {
              if (!open || matches.length === 0) return;
              if (e.key === "ArrowDown") { e.preventDefault(); setActiveIdx(i => Math.min(i+1, matches.length-1)); }
              if (e.key === "ArrowUp")   { e.preventDefault(); setActiveIdx(i => Math.max(i-1, 0)); }
              if (e.key === "Enter")     { e.preventDefault(); pick(matches[activeIdx]); }
              if (e.key === "Escape")    { setOpen(false); }
            }}
            style={{ textTransform: "uppercase" }}
            maxLength={40}
          />
          {open && matches.length > 0 && (
            <div className="gg-suggest">
              {matches.map((a, i) => (
                <div
                  key={a.code}
                  className={"gg-suggest-item" + (i === activeIdx ? " active" : "")}
                  onMouseDown={(e) => { e.preventDefault(); pick(a); }}
                  onMouseEnter={() => setActiveIdx(i)}
                >
                  <div className="flex items-center gap-3">
                    <div className="gg-suggest-code">{a.code}</div>
                    <div className="flex-1" style={{minWidth:0}}>
                      <div style={{fontWeight:600, fontSize:14}}>{a.city}</div>
                      <div className="gg-suggest-name">{a.name} · {a.country}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

      const [departureTime, setDepartureTime] = useState("");
      const [terminal, setTerminal] = useState("");
      const [seat, setSeat] = useState("");
      const [gate, setGate] = useState("");
      const [error, setError] = useState(null);

      const submit = () => {
        if (!airline.trim()) return setError("Airline is required.");
        if (!flightNumber.trim()) return setError("Flight number is required.");
        if (!departureAirport) return setError("Pick a departure airport from the list.");
        if (!arrivalAirport) return setError("Pick an arrival airport from the list.");
        if (!departureDate) return setError("Departure date is required.");
        if (!boardingTime) return setError("Boarding time is required (it powers the alert).");

        onSubmit({
          airline: airline.trim(),
          flightNumber: flightNumber.trim().toUpperCase(),
          passengerCount: Number(passengerCount) || 1,
          passengerNames: [],
          departureDate,
          boardingTime,
          departureTime: departureTime || boardingTime,
          departureAirport: { ...departureAirport, terminal: terminal.trim() || null },
          arrivalAirport,
          seat: seat.trim() || null,
          gate: gate.trim() || null,
        });
      };

      return (
        <div className="gg-card p-6 md:p-7 gg-fade-in">
          <div className="flex items-center gap-3 mb-5">
            <div className="gg-tag gg-tag-amber">01 · Trip details</div>
          </div>
          <h2 className="gg-display" style={{fontSize:30, fontWeight:800, lineHeight:1.1, margin:"6px 0 4px"}}>
            Tell GateGoat about your flight.
          </h2>
          <p style={{fontSize:14, opacity:0.7, marginBottom:24}}>
            Quick form — pulled from your boarding pass. Takes about 30 seconds.
          </p>

          <div className="grid gap-4" style={{gridTemplateColumns:"1fr"}}>
            <div className="grid gap-4 grid-cols-2 md:grid-cols-3">
              <div style={{gridColumn:"span 2"}}>
                <label className="gg-label">Airline</label>
                <input className="gg-input" value={airline} onChange={(e)=>setAirline(e.target.value)} placeholder="e.g., Indigo, American, BA" maxLength={40}/>
              </div>
              <div>
                <label className="gg-label">Flight #</label>
                <input className="gg-input gg-mono" style={{textTransform:"uppercase"}} value={flightNumber} onChange={(e)=>setFlightNumber(e.target.value.toUpperCase())} placeholder="6E2342" maxLength={10}/>
              </div>
            </div>

            <div className="grid gap-4 grid-cols-2">
              <AirportInput label="From" value={departureAirport} onChange={setDepartureAirport} placeholder="DEL, JFK, LHR…" />
              <AirportInput label="To" value={arrivalAirport} onChange={setArrivalAirport} placeholder="BOM, LAX…" />
            </div>

            <div className="grid gap-4 grid-cols-2 md:grid-cols-4">
              <div>
                <label className="gg-label">Date</label>
                <input type="date" className="gg-input" value={departureDate} onChange={(e)=>setDepartureDate(e.target.value)}/>
              </div>
              <div>
                <label className="gg-label">Boarding time</label>
                <input type="time" className="gg-input" value={boardingTime} onChange={(e)=>setBoardingTime(e.target.value)}/>
              </div>
              <div>
                <label className="gg-label">Depart time</label>
                <input type="time" className="gg-input" value={departureTime} onChange={(e)=>setDepartureTime(e.target.value)} placeholder="optional"/>
              </div>
              <div>
                <label className="gg-label">Travelers</label>
                <input type="number" min="1" max="20" className="gg-input" value={passengerCount} onChange={(e)=>setPassengerCount(e.target.value)}/>
              </div>
            </div>

            <div className="grid gap-4 grid-cols-2 md:grid-cols-3">
              <div>
                <label className="gg-label">Terminal</label>
                <input className="gg-input" value={terminal} onChange={(e)=>setTerminal(e.target.value)} placeholder="T2 · optional" maxLength={20}/>
              </div>
              <div>
                <label className="gg-label">Gate</label>
                <input className="gg-input" value={gate} onChange={(e)=>setGate(e.target.value)} placeholder="B7 · optional" maxLength={10}/>
              </div>
              <div>
                <label className="gg-label">Seat</label>
                <input className="gg-input gg-mono" style={{textTransform:"uppercase"}} value={seat} onChange={(e)=>setSeat(e.target.value.toUpperCase())} placeholder="12A · optional" maxLength={6}/>
              </div>
            </div>
          </div>

          {error && (
            <div className="flex items-start gap-2 mt-4" style={{fontSize:13, color:"#D9682B"}}>
              <Icon name="alert-circle" size={16}/>
              <span>{error}</span>
            </div>
          )}

          <button onClick={submit} className="gg-btn mt-6 flex items-center gap-2">
            <Icon name="send" size={16}/> Set up the trip
          </button>
        </div>
      );
    }

    // ============== BOARDING PASS DISPLAY ==============
    function Detail({ icon, label, value, accent }) {
      return (
        <div>
          <div className="gg-mono flex items-center gap-1.5" style={{fontSize:10, opacity:0.55, letterSpacing:"0.15em", marginBottom:4, textTransform:"uppercase"}}>
            <Icon name={icon} size={11}/>
            {label}
          </div>
          <div className="gg-display" style={{fontSize:18, fontWeight:700, color: accent ? "#D9682B" : "#1C1814"}}>{value}</div>
        </div>
      );
    }

    function BoardingPass({ data, onEdit }) {
      const dep = data.departureAirport || {};
      const arr = data.arrivalAirport || {};
      return (
        <div className="gg-pass overflow-hidden gg-fade-in">
          <div className="grid grid-cols-12">
            <div className="col-span-12 md:col-span-9 p-6 md:p-8">
              <div className="flex justify-between items-start mb-6 flex-wrap gap-3">
                <div>
                  <div className="gg-mono" style={{fontSize:11, opacity:0.55, letterSpacing:"0.15em"}}>BOARDING PASS</div>
                  <div className="gg-display" style={{fontSize:28, fontWeight:900, lineHeight:1.1}}>{data.airline}</div>
                </div>
                <div className="flex gap-2">
                  <div className="gg-tag gg-tag-amber">{data.flightNumber}</div>
                  <button onClick={onEdit} className="gg-btn-ghost" style={{padding:"4px 12px", fontSize:11}}>
                    <Icon name="edit" size={11}/> Edit
                  </button>
                </div>
              </div>
              <div className="flex items-center gap-4 mb-7">
                <div>
                  <div className="gg-mono" style={{fontSize:11, opacity:0.5}}>FROM</div>
                  <div className="gg-display" style={{fontSize:44, fontWeight:900, lineHeight:1}}>{dep.code}</div>
                  <div style={{fontSize:13, opacity:0.7, marginTop:2}}>{dep.city}</div>
                </div>
                <div className="gg-route-line"></div>
                <div className="text-right">
                  <div className="gg-mono" style={{fontSize:11, opacity:0.5}}>TO</div>
                  <div className="gg-display" style={{fontSize:44, fontWeight:900, lineHeight:1}}>{arr.code}</div>
                  <div style={{fontSize:13, opacity:0.7, marginTop:2}}>{arr.city}</div>
                </div>
              </div>
              <div className="gg-divider mb-5"></div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <Detail icon="calendar" label="Date" value={fmtDate(data.departureDate)} />
                <Detail icon="clock" label="Boarding" value={fmtTime(data.boardingTime)} accent />
                <Detail icon="plane" label="Departs" value={fmtTime(data.departureTime)} />
                <Detail icon="users" label="Travelers" value={`${data.passengerCount} ${data.passengerCount === 1 ? "person" : "people"}`} />
              </div>
            </div>
            <div className="hidden md:flex col-span-3 gg-perforation flex-col justify-between p-6" style={{background:"#FBE3CC"}}>
              <div>
                <div className="gg-mono" style={{fontSize:10, opacity:0.6, letterSpacing:"0.2em", marginBottom:4}}>GATE</div>
                <div className="gg-display" style={{fontSize:36, fontWeight:900, lineHeight:1}}>{data.gate || "TBA"}</div>
              </div>
              <div>
                <div className="gg-mono" style={{fontSize:10, opacity:0.6, letterSpacing:"0.2em", marginBottom:4}}>SEAT</div>
                <div className="gg-display" style={{fontSize:28, fontWeight:900}}>{data.seat || "—"}</div>
              </div>
              <div className="gg-orange"><GoatMark size={32}/></div>
            </div>
          </div>
        </div>
      );
    }

    // ============== ALERT BANNER ==============
    function AlertBanner({ ticket, userName, onNameChange, armed, fired, permState, now, onEnable, onCancel, onPreview }) {
      const target = boardingMinusFifteen(ticket?.departureDate, ticket?.boardingTime);
      const targetTimeStr = target ? target.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" }) : null;
      const ms = target ? target.getTime() - now : null;
      const isPast = ms !== null && ms <= 0;
      const countdown = target && !isPast ? formatTimeUntil(target, now) : null;
      const tooFar = ms !== null && ms > 2147483000;
      const baseClass = fired ? "gg-card-warm" : armed ? "gg-card-cool" : "gg-card";

      return (
        <div className={`${baseClass} mt-8 p-5 md:p-7 gg-fade-in`}>
          <div className="flex flex-wrap items-center gap-4 md:gap-6">
            <div style={{
              width:52, height:52, borderRadius:"50%",
              background: fired ? "#D9682B" : armed ? "#4A7BA8" : "#1C1814",
              color:"#F2EBDD", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0,
            }}>
              <Icon name={fired ? "bell-ring" : armed ? "check" : "bell"} size={22}/>
            </div>
            <div style={{flex:1, minWidth:240}}>
              <div className="gg-mono" style={{fontSize:11, opacity:0.6, letterSpacing:"0.15em"}}>
                {fired ? "🐐 BOARDING IN 15" : armed ? (isPast ? "ALERT — TIME PASSED" : "ALERT ARMED") : "PRE-BOARDING NUDGE"}
              </div>
              <div className="gg-display" style={{fontSize:22, fontWeight:800, lineHeight:1.2, marginTop:2}}>
                {fired
                  ? <>Time to move, {userName || "traveler"}.</>
                  : armed
                    ? (isPast ? <>Boarding window has already passed.</> : <>Heads up at <span className="gg-orange">{targetTimeStr}</span>{userName ? `, ${userName}` : ""}.</>)
                    : <>Get a 15-min nudge before boarding.</>}
              </div>
              {fired && ticket?.departureAirport?.terminal && (
                <div style={{fontSize:14, opacity:0.8, marginTop:4}}>
                  {ticket.airline} {ticket.flightNumber} · head to {ticket.departureAirport.terminal}.
                </div>
              )}
              {armed && !fired && !isPast && (
                <div style={{fontSize:13, opacity:0.75, marginTop:4}}>
                  {countdown}
                  {permState === "granted" ? " · system notification armed"
                    : permState === "denied" ? " · in-app banner only (system notifs blocked)"
                    : " · in-app banner only"}
                </div>
              )}
              {!armed && !fired && ticket?.boardingTime && (
                <div style={{fontSize:13, opacity:0.7, marginTop:4}}>
                  Boarding's at {fmtTime(ticket.boardingTime)} — we'll buzz you at {targetTimeStr}.
                </div>
              )}
            </div>
            {!armed && !fired && (
              <div className="flex flex-wrap items-end gap-3">
                <div>
                  <div className="gg-mono" style={{fontSize:9, opacity:0.6, letterSpacing:"0.15em", marginBottom:4}}>NAME</div>
                  <input type="text" value={userName} onChange={(e)=>onNameChange(e.target.value)} placeholder="Lakshya" className="gg-name-input"/>
                </div>
                <button onClick={onEnable} className="gg-btn" disabled={tooFar || isPast}>
                  {isPast ? "Boarding passed" : tooFar ? "Too far out" : "Enable alert"}
                </button>
              </div>
            )}
            {armed && !fired && (
              <div className="flex gap-2 flex-wrap">
                <button onClick={onPreview} className="gg-btn-ghost flex items-center gap-1">
                  <Icon name="bell-ring" size={13}/> Preview
                </button>
                <button onClick={onCancel} className="gg-btn-ghost flex items-center gap-1">
                  <Icon name="x" size={13}/> Cancel
                </button>
              </div>
            )}
            {fired && (
              <button onClick={onCancel} className="gg-btn-ghost flex items-center gap-1">
                <Icon name="check" size={13}/> Got it
              </button>
            )}
          </div>
          {!armed && !fired && (
            <div style={{fontSize:11, opacity:0.55, marginTop:14, lineHeight:1.5}}>
              Works while this tab stays open. Allow notifications to also get pinged on other tabs.
            </div>
          )}
        </div>
      );
    }

    // ============== BAG POLL ==============
    function BagPoll({ hasCheckInBag, onChange, boardingTime }) {
      const answered = hasCheckInBag !== null;
      const arriveYes = boardingTime ? minusMinutes(boardingTime, 90) : null;
      const arriveNo = boardingTime ? minusMinutes(boardingTime, 60) : null;
      const options = [
        { value: true,  icon: "🧳", label: "Yes, we're checking a bag", sub: "Bag drop + security takes longer", buffer: "1h 30m before boarding", arrive: arriveYes },
        { value: false, icon: "🎒", label: "Nope, carry-on only",       sub: "Straight to security",             buffer: "1h before boarding",     arrive: arriveNo  },
      ];

      return (
        <div className="mt-8 p-6 md:p-7 gg-fade-in" style={{
          background:"#FFF3E0", border:"1.5px solid #1C1814", borderRadius:16,
          boxShadow:"8px 8px 0 #1C1814", position:"relative",
        }}>
          <div style={{
            position:"absolute", top:-14, left:22, background:"#D9682B", color:"#FFFCF4",
            padding:"6px 14px", borderRadius:999, fontSize:11, fontWeight:700,
            letterSpacing:"0.15em", fontFamily:"'JetBrains Mono', monospace",
            border:"1.5px solid #1C1814", boxShadow:"3px 3px 0 #1C1814",
          }}>📊 FAMILY POLL</div>

          <div style={{marginTop:8}}>
            <div className="gg-display" style={{fontSize:28, fontWeight:800, lineHeight:1.15, marginBottom:4}}>
              Are you checking a bag?
            </div>
            <div style={{fontSize:13, opacity:0.7, marginBottom:22}}>
              Pick one — we'll set the right "arrive by" time for the family.
            </div>

            <div className="flex flex-col gap-3">
              {options.map(opt => {
                const selected = hasCheckInBag === opt.value;
                const dimmed = answered && !selected;
                return (
                  <button
                    key={String(opt.value)}
                    onClick={() => onChange(opt.value)}
                    style={{
                      display:"flex", alignItems:"center", gap:14, width:"100%", padding:"16px 18px",
                      background: selected ? "#1C1814" : "#FFFCF4",
                      color: selected ? "#F2EBDD" : "#1C1814",
                      border:"1.5px solid #1C1814", borderRadius:12, cursor:"pointer",
                      fontFamily:"inherit", textAlign:"left",
                      opacity: dimmed ? 0.45 : 1,
                      boxShadow: selected ? "5px 5px 0 #D9682B" : "none",
                      transform: selected ? "translate(-1px, -1px)" : "none",
                      transition:"all 200ms ease",
                    }}
                  >
                    <div style={{
                      width:24, height:24, borderRadius:"50%",
                      border:`2px solid ${selected ? "#F2EBDD" : "#1C1814"}`,
                      flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center",
                    }}>
                      {selected && <div style={{width:12, height:12, borderRadius:"50%", background:"#D9682B"}}/>}
                    </div>
                    <span style={{fontSize:26, lineHeight:1}}>{opt.icon}</span>
                    <div style={{flex:1, minWidth:0}}>
                      <div className="gg-display" style={{fontSize:17, fontWeight:700, lineHeight:1.2, marginBottom:2}}>
                        {opt.label}
                      </div>
                      <div style={{fontSize:12, opacity:0.7}}>{opt.sub}</div>
                    </div>
                    <div style={{textAlign:"right", flexShrink:0}}>
                      <div className="gg-mono" style={{fontSize:9, opacity: selected ? 0.6 : 0.5, letterSpacing:"0.1em"}}>ARRIVE</div>
                      <div className="gg-display" style={{fontSize:18, fontWeight:800, color: selected ? "#FBE3CC" : "#D9682B", lineHeight:1, marginTop:2}}>
                        {opt.arrive || "—"}
                      </div>
                      <div style={{fontSize:10, opacity:0.6, marginTop:2}}>{opt.buffer}</div>
                    </div>
                  </button>
                );
              })}
            </div>

            {answered && (
              <div className="gg-fade-in" style={{marginTop:14, fontSize:13, opacity:0.8, display:"flex", alignItems:"center", gap:8}}>
                <span style={{fontSize:16}}>🐐</span>
                <span>Locked in. Your route card is now tuned for <strong>{hasCheckInBag ? "1.5 hr" : "1 hr"} before boarding.</strong></span>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============== WEATHER CARD ==============
    function WeatherCard({ data, arrival, date, loading, error }) {
      const day = data?.daily;
      const code = day?.weather_code?.[0];
      const info = code !== undefined ? weatherInfo(code) : null;
      const max = day?.temperature_2m_max?.[0];
      const min = day?.temperature_2m_min?.[0];
      const precip = day?.precipitation_sum?.[0];
      const wind = day?.wind_speed_10m_max?.[0];
      const cardClass = info?.tone === "sun" ? "gg-card-warm" : info?.tone === "cool" ? "gg-card-cool" : "gg-card";

      return (
        <div className={`${cardClass} p-6 md:p-7`}>
          <div className="flex items-center justify-between mb-5">
            <div className="gg-tag gg-tag-blue">02 · Forecast</div>
            <Icon name="cloud-sun" size={20} style={{opacity:0.5}}/>
          </div>
          <div className="gg-mono" style={{fontSize:11, opacity:0.6, letterSpacing:"0.15em"}}>WHERE YOU LAND</div>
          <div className="gg-display" style={{fontSize:26, fontWeight:800, lineHeight:1.1, marginTop:2}}>
            {arrival?.city || "Destination"}
          </div>
          <div style={{fontSize:13, opacity:0.65, marginBottom:22}}>
            {fmtDate(date)} · {arrival?.code}
          </div>

          {loading && (
            <div className="flex items-center gap-2" style={{opacity:0.7}}>
              <Icon name="loader" size={16} className="gg-spin"/> Fetching forecast…
            </div>
          )}
          {error && (
            <div className="flex items-start gap-2" style={{fontSize:14, opacity:0.75}}>
              <Icon name="alert-circle" size={16}/>
              <span>{error}</span>
            </div>
          )}

          {data && info && (
            <div className="gg-fade-in">
              <div className="flex items-end gap-5">
                <Icon name={info.icon} size={68} strokeWidth={1.5} className="gg-orange"/>
                <div>
                  <div className="gg-display" style={{fontSize:56, fontWeight:900, lineHeight:0.9}}>{Math.round(max)}°</div>
                  <div style={{fontSize:13, opacity:0.7}}>low {Math.round(min)}° · {info.label}</div>
                </div>
              </div>
              <div className="gg-divider" style={{margin:"20px 0"}}></div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <div className="gg-mono" style={{fontSize:10, opacity:0.55, letterSpacing:"0.15em"}}>RAIN</div>
                  <div className="gg-display" style={{fontSize:18, fontWeight:700}}>
                    {precip != null ? `${precip.toFixed(1)} mm` : "—"}
                  </div>
                </div>
                <div>
                  <div className="gg-mono flex items-center gap-1" style={{fontSize:10, opacity:0.55, letterSpacing:"0.15em"}}>
                    <Icon name="wind" size={10}/> WIND
                  </div>
                  <div className="gg-display" style={{fontSize:18, fontWeight:700}}>
                    {wind != null ? `${Math.round(wind)} km/h` : "—"}
                  </div>
                </div>
              </div>
              <PackingTip code={code} max={max} precip={precip}/>
            </div>
          )}
        </div>
      );
    }

    function PackingTip({ code, max, precip }) {
      if (code === undefined) return null;
      let tip;
      if ([61, 63, 65, 80, 81, 82, 51, 53, 55].includes(code) || precip > 2) tip = "Pack a rain layer — and tuck one in the kids' bag too.";
      else if ([71, 73, 75, 77, 85, 86].includes(code)) tip = "Snow on the ground. Warm boots, hats, the works.";
      else if ([95, 96, 99].includes(code)) tip = "Storms expected — flexible plans, indoor backups.";
      else if (max >= 28) tip = "Hot landing. Light layers, sunscreen, water.";
      else if (max <= 5) tip = "Brisk. Coats and gloves on top of the suitcase.";
      else if (max <= 15) tip = "Light jacket weather. Easy.";
      else tip = "Mild and easygoing — comfy clothes will do.";
      return (
        <div className="mt-5 p-3 flex items-start gap-2" style={{background:"rgba(28,24,20,0.06)", borderRadius:10, fontSize:13}}>
          <span style={{fontSize:16}}>🧳</span>
          <span style={{lineHeight:1.4}}>{tip}</span>
        </div>
      );
    }

    // ============== ROUTE CARD ==============
    function RouteCard({ ticket, userLoc, distanceKm, onRequest, loading, error, hasCheckInBag }) {
      const dep = ticket.departureAirport || {};
      const drivingMin = distanceKm ? Math.round((distanceKm / 50) * 60) : null;
      const bagBuffer = hasCheckInBag === false ? 60 : 90;

      return (
        <div className="gg-card p-6 md:p-7">
          <div className="flex items-center justify-between mb-5">
            <div className="gg-tag gg-tag-sage">03 · Route</div>
            <Icon name="navigation" size={20} style={{opacity:0.5}}/>
          </div>
          <div className="gg-mono" style={{fontSize:11, opacity:0.6, letterSpacing:"0.15em"}}>YOUR TERMINAL</div>
          <div className="gg-display" style={{fontSize:26, fontWeight:800, lineHeight:1.1, marginTop:2}}>
            {dep.terminal || "Check at airport"}
          </div>
          <div style={{fontSize:13, opacity:0.65, marginBottom:22}}>{dep.name} · {dep.city}</div>

          {!userLoc && !loading && (
            <div>
              <p style={{fontSize:14, opacity:0.75, marginBottom:16, lineHeight:1.5}}>
                Share your location and the goat will work out how far you are from the gate — and roughly how long the drive runs.
              </p>
              <button onClick={onRequest} className="gg-btn flex items-center gap-2">
                <Icon name="map-pin" size={16}/> Where am I?
              </button>
              {error && (
                <div className="flex items-start gap-2 mt-4" style={{fontSize:13, opacity:0.75}}>
                  <Icon name="alert-circle" size={14}/><span>{error}</span>
                </div>
              )}
            </div>
          )}

          {loading && (
            <div className="flex items-center gap-2" style={{opacity:0.7}}>
              <Icon name="loader" size={16} className="gg-spin"/> Pinpointing you…
            </div>
          )}

          {userLoc && distanceKm != null && (
            <div className="gg-fade-in">
              <div className="flex items-end gap-3 mb-4">
                <div className="gg-display gg-orange" style={{fontSize:64, fontWeight:900, lineHeight:0.85}}>
                  {distanceKm < 10 ? distanceKm.toFixed(1) : Math.round(distanceKm)}
                </div>
                <div className="gg-mono" style={{fontSize:14, opacity:0.7, paddingBottom:8}}>KM</div>
              </div>
              <div style={{fontSize:14, opacity:0.75, marginBottom:18}}>
                from where you stand to {dep.code}{dep.terminal ? `, ${dep.terminal}` : ""}.
              </div>
              <div className="gg-divider mb-4"></div>
              <div className="flex items-center gap-3 mb-4">
                <div className="text-center">
                  <div style={{width:28, height:28, borderRadius:"50%", background:"#1C1814", color:"#F2EBDD", display:"flex", alignItems:"center", justifyContent:"center"}}>
                    <span style={{fontSize:12}}>📍</span>
                  </div>
                  <div className="gg-mono" style={{fontSize:9, opacity:0.6, marginTop:4}}>YOU</div>
                </div>
                <div style={{flex:1, height:2, background:"repeating-linear-gradient(to right, #1C1814 0, #1C1814 5px, transparent 5px, transparent 10px)"}}></div>
                <div className="text-center">
                  <div style={{width:28, height:28, borderRadius:"50%", background:"#D9682B", color:"#FFFCF4", display:"flex", alignItems:"center", justifyContent:"center"}}>
                    <Icon name="plane" size={14}/>
                  </div>
                  <div className="gg-mono" style={{fontSize:9, opacity:0.6, marginTop:4}}>{dep.code}</div>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <div className="gg-mono" style={{fontSize:10, opacity:0.55, letterSpacing:"0.15em"}}>EST. DRIVE</div>
                  <div className="gg-display" style={{fontSize:18, fontWeight:700}}>
                    ~{drivingMin >= 60 ? `${Math.floor(drivingMin / 60)}h ${drivingMin % 60}m` : `${drivingMin} min`}
                  </div>
                </div>
                <div>
                  <div className="gg-mono" style={{fontSize:10, opacity:0.55, letterSpacing:"0.15em"}}>ARRIVE BY</div>
                  <div className="gg-display gg-orange" style={{fontSize:18, fontWeight:700}}>
                    {ticket.boardingTime ? minusMinutes(ticket.boardingTime, bagBuffer) : "—"}
                  </div>
                </div>
              </div>
              <div className="mt-5 p-3 flex items-start gap-2" style={{background:"rgba(28,24,20,0.06)", borderRadius:10, fontSize:13}}>
                <span style={{fontSize:16}}>🐐</span>
                <span style={{lineHeight:1.4}}>
                  {hasCheckInBag === true ? "With check-in bags, head out 90 min before boarding to clear bag drop and security."
                    : hasCheckInBag === false ? "Carry-on only — 60 min before boarding leaves room for security."
                    : "Tell us about bags above — we'll fine-tune your arrive-by."}
                </span>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============== MAIN APP ==============
    function GateGoat() {
      const [ticketData, setTicketData] = useState(null);
      const [weatherData, setWeatherData] = useState(null);
      const [userLoc, setUserLoc] = useState(null);
      const [distanceKm, setDistanceKm] = useState(null);
      const [loadingWeather, setLoadingWeather] = useState(false);
      const [loadingLoc, setLoadingLoc] = useState(false);
      const [weatherErr, setWeatherErr] = useState(null);
      const [locErr, setLocErr] = useState(null);

      const [userName, setUserName] = useState("Lakshya");
      const [alertArmed, setAlertArmed] = useState(false);
      const [alertFired, setAlertFired] = useState(false);
      const [showToast, setShowToast] = useState(false);
      const [permState, setPermState] = useState(
        typeof Notification !== "undefined" ? Notification.permission : "unsupported"
      );
      const [now, setNow] = useState(Date.now());
      const [hasCheckInBag, setHasCheckInBag] = useState(null);
      const [editingTicket, setEditingTicket] = useState(false);

      // weather fetch
      useEffect(() => {
        if (!ticketData?.arrivalAirport?.lat || !ticketData?.departureDate) return;
        const days = daysFromToday(ticketData.departureDate);
        if (days === null || days < 0) { setWeatherErr("Flight date appears to be in the past."); return; }
        if (days > 15) { setWeatherErr(`Flight is ${days} days out — forecast available within 15 days.`); return; }
        setLoadingWeather(true);
        setWeatherErr(null);
        const { lat, lng } = ticketData.arrivalAirport;
        const date = ticketData.departureDate;
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code,wind_speed_10m_max&timezone=auto&start_date=${date}&end_date=${date}&temperature_unit=celsius`)
          .then(r => r.json())
          .then(d => setWeatherData(d))
          .catch(() => setWeatherErr("Couldn't fetch the forecast."))
          .finally(() => setLoadingWeather(false));
      }, [ticketData]);

      // tick for countdown
      useEffect(() => {
        const id = setInterval(() => setNow(Date.now()), 20000);
        return () => clearInterval(id);
      }, []);

      // schedule alert
      useEffect(() => {
        if (!alertArmed || alertFired) return;
        const target = boardingMinusFifteen(ticketData?.departureDate, ticketData?.boardingTime);
        if (!target) return;
        const ms = target.getTime() - Date.now();
        if (ms <= 0) { fireAlert(); return; }
        if (ms > 2147483000) return;
        const timerId = setTimeout(fireAlert, ms);
        return () => clearTimeout(timerId);
      }, [alertArmed, alertFired, ticketData]);

      const fireAlert = () => {
        setAlertFired(true);
        setShowToast(true);
        if (typeof Notification !== "undefined" && Notification.permission === "granted" && ticketData) {
          try {
            new Notification(`Hey ${userName || "traveler"} 🐐`, {
              body: `${ticketData.airline || "Your flight"} ${ticketData.flightNumber || ""} boards in 15 min. ${ticketData.departureAirport?.terminal ? "Head to " + ticketData.departureAirport.terminal + "." : "Head to your gate."}`,
              tag: "gategoat-boarding",
            });
          } catch (e) {}
        }
      };

      const enableAlert = async () => {
        if (typeof Notification !== "undefined") {
          if (Notification.permission === "default") {
            try {
              const p = await Notification.requestPermission();
              setPermState(p);
            } catch (e) {}
          } else {
            setPermState(Notification.permission);
          }
        }
        setAlertArmed(true);
      };

      const cancelAlert = () => {
        setAlertArmed(false);
        setAlertFired(false);
        setShowToast(false);
      };

      const previewAlert = () => {
        if (typeof Notification !== "undefined" && Notification.permission === "granted") {
          try {
            new Notification(`Hey ${userName || "traveler"} 🐐 (preview)`, {
              body: `This is what your alert will look like — flight boards in 15 minutes.`,
              tag: "gategoat-preview",
            });
          } catch (e) {}
        }
        setShowToast(true);
        setTimeout(() => setShowToast(false), 6000);
      };

      const requestLocation = () => {
        setLocErr(null);
        setLoadingLoc(true);
        if (!navigator.geolocation) { setLocErr("This device doesn't support geolocation."); setLoadingLoc(false); return; }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            setUserLoc(loc);
            if (ticketData?.departureAirport?.lat) {
              const d = haversine(loc.lat, loc.lng, ticketData.departureAirport.lat, ticketData.departureAirport.lng);
              setDistanceKm(d);
            }
            setLoadingLoc(false);
          },
          (err) => {
            setLocErr(err.code === 1 ? "Location permission denied. Enable it in your browser to continue." : "Couldn't get your location — try again.");
            setLoadingLoc(false);
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
        );
      };

      const reset = () => {
        setTicketData(null);
        setWeatherData(null);
        setUserLoc(null);
        setDistanceKm(null);
        setWeatherErr(null);
        setLocErr(null);
        setAlertArmed(false);
        setAlertFired(false);
        setShowToast(false);
        setHasCheckInBag(null);
        setEditingTicket(false);
      };

      return (
        <div className="gg-root">
          <div className="relative" style={{zIndex:1}}>
            {showToast && (
              <div className="gg-toast" onClick={()=>setShowToast(false)} role="button">
                <div className="gg-toast-inner">
                  <div className="gg-toast-icon"><Icon name="bell-ring" size={22}/></div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:800, fontSize:15, marginBottom:2}}>Time to move, {userName || "traveler"} 🐐</div>
                    <div style={{fontSize:13, opacity:0.85}}>
                      {ticketData?.airline} {ticketData?.flightNumber} boards in 15 min
                      {ticketData?.departureAirport?.terminal ? ` · ${ticketData.departureAirport.terminal}` : ""}
                    </div>
                  </div>
                  <Icon name="x" size={18} style={{opacity:0.6}}/>
                </div>
              </div>
            )}

            <header className="max-w-6xl mx-auto px-6 pt-8 pb-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div style={{color:"#1C1814"}}><GoatMark size={42}/></div>
                <div>
                  <div className="gg-display" style={{fontSize:26, fontWeight:900, lineHeight:1}}>GateGoat</div>
                  <div className="gg-mono" style={{fontSize:10, opacity:0.6, letterSpacing:"0.15em"}}>FAMILY · TRAVEL · CO.</div>
                </div>
              </div>
              {ticketData && !editingTicket && (
                <button onClick={reset} className="gg-btn-ghost flex items-center gap-2">
                  <Icon name="refresh" size={14}/> New trip
                </button>
              )}
            </header>

            {(!ticketData || editingTicket) && (
              <section className="max-w-4xl mx-auto px-6 pt-4 pb-20 gg-fade-in">
                {!ticketData && (
                  <div className="text-center mb-10">
                    <div className="gg-tag gg-tag-amber mb-6" style={{display:"inline-flex"}}>
                      <span style={{fontSize:14}}>🐐</span> Don't miss the gate
                    </div>
                    <h1 className="gg-display" style={{fontSize:"clamp(48px, 8vw, 88px)", fontWeight:900, lineHeight:0.95, marginBottom:18}}>
                      Travel days,<br/>
                      <em className="gg-orange" style={{fontStyle:"italic", fontWeight:500}}>herded gently.</em>
                    </h1>
                    <p style={{fontSize:18, maxWidth:540, margin:"0 auto", opacity:0.75, lineHeight:1.5}}>
                      A pocket co-pilot for family travel. Enter your flight — get the destination forecast, distance to your terminal, and a 15-minute pre-boarding nudge.
                    </p>
                  </div>
                )}

                <TicketForm onSubmit={(d) => { setTicketData(d); setEditingTicket(false); }} />

                {!ticketData && (
                  <div className="grid md:grid-cols-3 gap-5 mt-14 gg-stagger">
                    {[
                      { icon:"plane-takeoff", title:"Flight rounded up", desc:"Number, airline, boarding time, and the whole party — read in a beat.", tag:"01 · Trip", color:"#D9682B" },
                      { icon:"cloud-sun",     title:"Weather where you land", desc:"We pull the forecast for your destination on flight day. Pack accordingly.", tag:"02 · Forecast", color:"#4A7BA8" },
                      { icon:"navigation",    title:"Right terminal, no panic", desc:"Distance from where you stand to the exact terminal your airline uses.", tag:"03 · Route", color:"#7B8A6E" },
                    ].map((f, i) => (
                      <div key={i} className="gg-card p-5">
                        <div className="gg-tag mb-4" style={{background:f.color}}>{f.tag}</div>
                        <Icon name={f.icon} size={28} style={{marginBottom:12}}/>
                        <div className="gg-display" style={{fontSize:20, fontWeight:700, marginBottom:6}}>{f.title}</div>
                        <div style={{fontSize:14, opacity:0.7, lineHeight:1.5}}>{f.desc}</div>
                      </div>
                    ))}
                  </div>
                )}
              </section>
            )}

            {ticketData && !editingTicket && (
              <section className="max-w-5xl mx-auto px-6 pb-20 gg-fade-in">
                <BoardingPass data={ticketData} onEdit={() => setEditingTicket(true)} />

                <AlertBanner
                  ticket={ticketData}
                  userName={userName}
                  onNameChange={setUserName}
                  armed={alertArmed}
                  fired={alertFired}
                  permState={permState}
                  now={now}
                  onEnable={enableAlert}
                  onCancel={cancelAlert}
                  onPreview={previewAlert}
                />

                <BagPoll
                  hasCheckInBag={hasCheckInBag}
                  onChange={setHasCheckInBag}
                  boardingTime={ticketData.boardingTime}
                />

                <div className="grid md:grid-cols-2 gap-8 mt-10">
                  <WeatherCard
                    data={weatherData}
                    arrival={ticketData.arrivalAirport}
                    date={ticketData.departureDate}
                    loading={loadingWeather}
                    error={weatherErr}
                  />
                  <RouteCard
                    ticket={ticketData}
                    userLoc={userLoc}
                    distanceKm={distanceKm}
                    onRequest={requestLocation}
                    loading={loadingLoc}
                    error={locErr}
                    hasCheckInBag={hasCheckInBag}
                  />
                </div>
              </section>
            )}

            <footer className="max-w-6xl mx-auto px-6 pt-14 pb-10">
              {/* divider */}
              <div style={{
                height:1, background:"#1C1814", opacity:0.18, marginBottom:36,
                position:"relative",
              }}>
                <div style={{
                  position:"absolute", left:"50%", top:-13, transform:"translateX(-50%)",
                  background:"#F7F0DF", padding:"0 14px",
                }}>
                  <span className="gg-mono" style={{fontSize:10, letterSpacing:"0.25em", opacity:0.55}}>
                    ★ MADE WITH HEART ★
                  </span>
                </div>
              </div>

              {/* maker card */}
              <div className="flex flex-col md:flex-row gap-6 md:gap-8 items-center md:items-start" style={{
                background:"#FFFCF4",
                border:"1.5px solid #1C1814",
                borderRadius:18,
                padding:"28px 26px",
                boxShadow:"6px 6px 0 #1C1814",
                position:"relative",
              }}>
                {/* corner stamp */}
                <div style={{
                  position:"absolute", top:-14, right:24,
                  background:"#4A7BA8", color:"#FFFCF4",
                  padding:"6px 14px", borderRadius:999, fontSize:11, fontWeight:700,
                  letterSpacing:"0.15em", fontFamily:"'JetBrains Mono', monospace",
                  border:"1.5px solid #1C1814", boxShadow:"3px 3px 0 #1C1814",
                }}>👋 MEET THE MAKER</div>

                {/* maker mark — kept anonymous on purpose */}
                <div style={{flexShrink:0, position:"relative"}}>
                  <div style={{
                    width:148, height:148, borderRadius:"50%",
                    background:"#FFE9CC",
                    border:"3px solid #1C1814",
                    boxShadow:"5px 5px 0 #D9682B",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    position:"relative", overflow:"hidden",
                  }}>
                    {/* subtle dotted texture */}
                    <div style={{
                      position:"absolute", inset:0,
                      backgroundImage:"radial-gradient(#1C1814 1px, transparent 1px)",
                      backgroundSize:"10px 10px",
                      opacity:0.08,
                    }}/>
                    <div style={{position:"relative", color:"#1C1814"}}>
                      <GoatMark size={86}/>
                    </div>
                  </div>
                  {/* monogram badge */}
                  <div style={{
                    position:"absolute", bottom:-6, right:-6,
                    background:"#1C1814", color:"#FFFCF4",
                    minWidth:42, height:42, padding:"0 10px", borderRadius:999,
                    display:"flex", alignItems:"center", justifyContent:"center",
                    border:"2px solid #1C1814",
                    fontSize:13, fontWeight:800, letterSpacing:"0.05em",
                    fontFamily:"'JetBrains Mono', monospace",
                    boxShadow:"2px 2px 0 #D9682B",
                  }}>LRS</div>
                </div>

                {/* bio */}
                <div style={{flex:1, textAlign:"left"}}>
                  <div className="gg-mono" style={{fontSize:10, letterSpacing:"0.2em", opacity:0.6, marginBottom:6}}>
                    FOUNDER · CEO · CHIEF GOAT
                  </div>
                  <div className="gg-display" style={{fontSize:30, fontWeight:800, lineHeight:1.1, marginBottom:8}}>
                    Lakshya Raj Singh
                  </div>
                  <div style={{fontSize:14, lineHeight:1.55, opacity:0.85, marginBottom:14, maxWidth:560}}>
                    Lakshya is an <strong>11-year-old</strong> from <strong>Gurugram, India</strong> who
                    got tired of his family's pre-flight chaos — the <em>"did we leave on time?"</em>, the
                    <em> "is it raining there?"</em>, the <em>"who packed what?"</em> — and decided to
                    build the tool he wished they had. GateGoat is the result.
                  </div>
                  <div className="flex flex-wrap gap-2" style={{marginBottom:4}}>
                    <span className="gg-mono" style={{
                      fontSize:10, padding:"4px 10px", borderRadius:999,
                      background:"#FFE9CC", border:"1px solid #1C1814",
                      letterSpacing:"0.1em",
                    }}>📍 GURUGRAM</span>
                    <span className="gg-mono" style={{
                      fontSize:10, padding:"4px 10px", borderRadius:999,
                      background:"#E0EBF5", border:"1px solid #1C1814",
                      letterSpacing:"0.1em",
                    }}>🎂 AGE 11</span>
                    <span className="gg-mono" style={{
                      fontSize:10, padding:"4px 10px", borderRadius:999,
                      background:"#E8F0E2", border:"1px solid #1C1814",
                      letterSpacing:"0.1em",
                    }}>✈️ PROBLEM-SOLVER</span>
                  </div>
                </div>
              </div>

              {/* trademark line */}
              <div className="flex justify-between items-center flex-wrap gap-3" style={{marginTop:28}}>
                <div className="gg-mono" style={{fontSize:11, opacity:0.65, letterSpacing:"0.1em"}}>
                  GateGoat™ · © 2026 Lakshya Raj Singh · All rights reserved.
                </div>
                <div className="gg-mono" style={{fontSize:11, opacity:0.55, letterSpacing:"0.15em"}}>
                  SAFE TRAVELS, FAM 🐐
                </div>
              </div>
            </footer>
          </div>
        </div>
      );
    }

    // ============== BOOTSTRAP ==============
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<GateGoat/>);
  </script>
</body>
</html>
